[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfmi_sysml2"
dynamic = ["version"]
description = "Generate FMI 2.0 CoSimulation artifacts from a SysML v2 architecture model."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "pyssp contributors" }
]
# Both dependencies are direct URLs, not index lookups: they are immutable
# release assets attached by each project's wheels workflow. The tag is
# v<version>, and an unreleased tag makes this wheel uninstallable.
dependencies = [
  "pycps-sysml2 @ https://github.com/pyssporg/pycps_sysml2/releases/download/v0.2.0/pycps_sysml2-0.2.0-py3-none-any.whl",
  "experimental-pyssp-standard @ https://github.com/pyssporg/experimental_pyssp_standard/releases/download/v0.9.3.dev0/experimental_pyssp_standard-0.9.3.dev0-py3-none-any.whl"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff"
]

[project.scripts]
pyfmi = "pyfmi_sysml2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
pyfmi_sysml2 = ["fmi2_headers/*.h"]

[tool.setuptools.dynamic]
version = { attr = "pyfmi_sysml2.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyfmi_sysml2*"]

[tool.ruff]
# Lint selection is explicit so a ruff upgrade cannot change the gate.
lint.select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "static: inspects source or files without executing the package",
  "unit: one object's behaviour, no generated artifact",
  "component: a generated artifact is the unit under test",
  "contract: two directions must agree (round-trip, sync)",
  "system: the CLI is driven end to end",
  "slow: not part of the default CI subset",
]
